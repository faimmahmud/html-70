<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
  let marks = Number(prompt("Enter student percentage:"));

  if (marks >= 80) {
    document.write("A+");
  }
  else if (marks >= 70) {
    document.write("A");
  }
  else if (marks >= 60) {
    document.write("B");
  }
  else
  {
    document.write("fail");
  }
</script>
</body>
</html>
