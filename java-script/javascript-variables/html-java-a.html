<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //numbrt type
        let a = 23;
        let b = 2;
        let sum = (a+b);
        console.log(typeof sum)

        //string type
        let first_name = "rakib";
        let last_name = "ahmed";
        let full_name= first_name+""+last_name;
        console.log(typeof full_name);

        //undidine
        let num;
        console.log(num);

        //null (no value)
        let nv ="";
        console.log(typeof nv);


        //boolean type =true / false
        let p = 5;
        let q = 7;
        let r = p < q;
        console.log(typeof r);


    </script>
</body>
